// safety net: never show undefined / null / NaN
function scrub(){document.querySelectorAll('#root,#ov').forEach(r=>{const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/undefined|null|NaN|\[object Object\]/.test(n.nodeValue)&&!n.parentElement.closest('textarea,input,script,style'))n.nodeValue=n.nodeValue.replace(/₹\s*(undefined|null|NaN)/g,'₹0').replace(/\b(undefined|null|NaN)\b|\[object Object\]/g,'-')}});

<script>// ===== v8: modal close UX, a11y, touch targets =====
let _lf=null,_op=false;
closeM=function(){const o=$('#ov');if(!o)return;o.remove();document.body.classList.remove('mo');const r=$('#root');if(r)r.inert=false;
 if(!_op&&_lf&&_lf.isConnected){try{_lf.focus()}catch(e){}}if(!_op)_lf=null};
const _m8=modal;
modal=function(h){if(!$('#ov'))_lf=document.activeElement;_op=true;try{_m8(h)}finally{_op=false}
 const md=$('#ov .md');if(!md)return;md.setAttribute('role','dialog');md.setAttribute('aria-modal','true');
 const t=md.querySelector('h2');if(t){t.id='mt8';md.setAttribute('aria-labelledby','mt8');if(!t.classList.contains('mt'))t.style.paddingRight='48px'}
 md.insertAdjacentHTML('afterbegin','<button type="button" class="mx" data-a="close" aria-label="Close" title="Close">\u00d7</button>');
 document.body.classList.add('mo');const r=$('#root');if(r)r.inert=true;md.querySelector('.mx').focus({preventScroll:true})};
document.addEventListener('keydown',e=>{
 if(e.key=='Escape'){if($('#ov')){e.preventDefault();closeM()}else if(ST.drawer){ST.drawer=false;draw()}return}
 if(e.key!='Tab')return;const o=$('#ov');if(!o)return;
 const f=[...o.querySelectorAll('button,a[href],input,select,textarea')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
 const a=f[0],z=f[f.length-1],cur=document.activeElement;
 if(e.shiftKey&&(cur==a||!o.contains(cur))){e.preventDefault();z.focus()}else if(!e.shiftKey&&(cur==z||!o.contains(cur))){e.preventDefault();a.focus()}});
function a11y(){const r=$('#root');if(!r)return;
 r.querySelectorAll('.mh button[data-a="drawer"]').forEach(b=>{b.setAttribute('aria-label',ST.drawer?'Close menu':'Open menu');b.setAttribute('aria-expanded',!!ST.drawer)});
 r.querySelectorAll('.nv.on').forEach(b=>b.setAttribute('aria-current','page'));
 r.querySelectorAll('#q').forEach(i=>i.setAttribute('aria-label','Search customers'));
 r.querySelectorAll('select').forEach(s=>{if(!s.getAttribute('aria-label'))s.setAttribute('aria-label',(s.options[0]||{}).text||'Filter')});
 r.querySelectorAll('input[data-k="min"]').forEach(i=>i.setAttribute('aria-label','Minimum amount'));
 r.querySelectorAll('input[data-k="max"]').forEach(i=>i.setAttribute('aria-label','Maximum amount'));
 r.querySelectorAll('input[type="date"],input[type="month"]').forEach(i=>i.setAttribute('aria-label',i.dataset.a=='to'?'To date':i.dataset.a=='from'?'From date':'Date'));
 r.querySelectorAll('input[data-a="selall"]').forEach(i=>i.setAttribute('aria-label','Select all payments on this page'));
 r.querySelectorAll('input[data-a="sel"]').forEach(i=>i.setAttribute('aria-label','Select payment'));
 if(ST.drawer&&matchMedia('(max-width:767px)').matches)r.insertAdjacentHTML('beforeend','<div class="bk" data-a="drawer" aria-hidden="true"></div>')}
const _d8=draw;draw=function(){_d8();a11y()};
a11y();
</script>
