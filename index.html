<style>

.ov{align-items:flex-end;padding:0}.md{border-radius:16px 16px 0 0;max-width:none}.toast{left:16px;right:16px;bottom:76px}.ctl input{min-width:100%}}

<script>

cn=['connectionNumber','Connection No.'],pk=['package','Package','r',c=>fm(c.package)],dueC=['dueDate','Due Date',0,c=>fd(c.dueDate)],ad=['monthlyAmount','Amount Due','r',c=>fm(c.monthlyAmount)],

<script>

const API='https://script.google.com/macros/s/AKfycbyblAiJsoY77HdjBTmJNJchHmm-fKXH5Eaz0EFPUGdAXqnL8_nbSijMp9ZilK12j2f6/exec';
let HY=false,DBERR='',seq=0;
let DEMO=false;
const API_ERR='Cannot reach the Sheet backend. Redeploy Code.gs as a Web app with access set to Anyone';
function jp(){return new Promise((res,rej)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script'),end=()=>{clearTimeout(t);delete window[cb];s.remove()},t=setTimeout(()=>{end();rej(new Error(API_ERR))},15000);
window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej(new Error(API_ERR))};s.src=API+'?callback='+cb+'&t='+Date.now();document.head.appendChild(s)})}
async function hydrate(){const my=++seq;ST.sync.busy=true;draw();
try{if(!/^https:/.test(API))throw new Error('Backend URL not set');const j=await jp();if(!j.ok)throw new Error(j.error||'Request failed');
if(my!=seq)return;C=j.customers;P=j.payments;DEMO=false;DBERR='';ST.sync={t:new Date(),ok:true,busy:false}}
